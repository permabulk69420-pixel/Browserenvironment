name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BrowserEnvironment.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrowserEnvironment-${{ github.run_number }}
          path: BrowserEnvironment.apk

      - name: Publish to Releases (latest)
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest build (#${{ github.run_number }})"
          body: |
            Build #${{ github.run_number }} from commit ${{ github.sha }}.
            Download **BrowserEnvironment.apk** below and sideload it with SideQuest or `adb install -r BrowserEnvironment.apk`.
          commit: ${{ github.sha }}
          artifacts: BrowserEnvironment.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: false
          makeLatest: true
