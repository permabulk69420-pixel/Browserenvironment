<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root { --bg:#070814; --card:#12142b; --card2:#1a1d3d; --text:#e8eaff; --muted:#8e93c7; --accent:#39a7ff; --accent2:#9b5cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 0%, #1b1446 0%, var(--bg) 60%); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:64px 32px; }
  h1 { font-size:44px; margin:0 0 8px; letter-spacing:-0.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { color:var(--muted); margin:0 0 36px; font-size:18px; }
  form { display:flex; gap:12px; margin-bottom:44px; }
  input { flex:1; font-size:24px; padding:18px 24px; border-radius:18px; border:2px solid #2a2f66; background:#0d0f24; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  button { font-size:22px; padding:0 30px; border-radius:18px; border:0; color:white; background:linear-gradient(90deg,var(--accent),var(--accent2)); cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  a.tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:150px; border-radius:22px;
    background:linear-gradient(160deg,var(--card2),var(--card)); color:var(--text); text-decoration:none; font-size:22px; font-weight:600;
    border:2px solid transparent; transition:transform .12s, border-color .12s; }
  a.tile:hover { border-color:var(--accent); transform:translateY(-3px); }
  .ico { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:white; }
</style>
</head>
<body>
<main>
  <h1>Browser Environment</h1>
  <p class="sub">Search or type a web address. Grab the frame with your grip button to move the screen.</p>
  <form onsubmit="go(event)">
    <input id="q" autocomplete="off" placeholder="Search Google or type a URL">
    <button type="submit">Go</button>
  </form>
  <div class="grid">
    <a class="tile" href="https://www.youtube.com/"><span class="ico" style="background:#ff0033">▶</span>YouTube</a>
    <a class="tile" href="https://www.google.com/"><span class="ico" style="background:#4285f4">G</span>Google</a>
    <a class="tile" href="https://www.twitch.tv/"><span class="ico" style="background:#9146ff">T</span>Twitch</a>
    <a class="tile" href="https://www.reddit.com/"><span class="ico" style="background:#ff4500">r</span>Reddit</a>
    <a class="tile" href="https://en.wikipedia.org/"><span class="ico" style="background:#555">W</span>Wikipedia</a>
    <a class="tile" href="https://github.com/"><span class="ico" style="background:#24292f">⌥</span>GitHub</a>
    <a class="tile" href="https://kick.com/"><span class="ico" style="background:#53fc18;color:#000">K</span>Kick</a>
    <a class="tile" href="https://duckduckgo.com/"><span class="ico" style="background:#de5833">D</span>DuckDuckGo</a>
  </div>
</main>
<script>
function go(e){
  e.preventDefault();
  var q=document.getElementById('q').value.trim();
  if(!q) return;
  var looksUrl=/^(https?:\/\/)?[^\s]+\.[^\s]{2,}$/i.test(q);
  location.href = looksUrl ? (/^https?:\/\//i.test(q)?q:'https://'+q) : 'https://www.google.com/search?q='+encodeURIComponent(q);
}
</script>
</body>
</html>
